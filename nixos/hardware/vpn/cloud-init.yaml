system_info:
  distro: nixos
  network:
    renderers: ['networkd']
  default_user:
    name: solarliner
  users:
    - default
  chpasswd:
    expire: false
  cloud_init_modules:
    - migrator
    - seed_random
    - growpart
    - resizefs
  cloud_config_modules:
    - disk_setup
    - mounts
    - set-passwords
    - ssh
  cloud_final_modules: []
